<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#primaryGrad)" />
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Protective Caring Hands (Stylized) -->
  <path d="M 28 78 C 32 66, 46 62, 54 68 C 50 78, 36 84, 28 78 Z" fill="rgba(255,255,255,0.9)" />
  <path d="M 92 78 C 88 66, 74 62, 66 68 C 70 78, 84 84, 92 78 Z" fill="rgba(255,255,255,0.9)" />

  <!-- Central Search Magnifier -->
  <circle cx="56" cy="48" r="22" fill="none" stroke="#ffffff" stroke-width="6" />
  <circle cx="56" cy="48" r="14" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Sparkle of Hope inside glass -->
  <path d="M 56 38 L 58 45 L 65 47 L 58 49 L 56 56 L 54 49 L 47 47 L 54 45 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Magnifier Handle -->
  <line x1="72" y1="64" x2="88" y2="80" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="72" y1="64" x2="84" y2="76" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Tiny Heart of Goodness at bottom -->
  <path d="M 60 92 C 60 92, 50 84, 50 78 C 50 74, 53 72, 56 74 C 58 76, 60 78, 60 78 C 60 78, 62 76, 64 74 C 67 72, 70 74, 70 78 C 70 84, 60 92, 60 92 Z" fill="#ef4444" />
</svg>
